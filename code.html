<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hoshi Saga - WAFlash</title>

    <!-- أداة فحص الموبايل عشان لو في أي تفصيلة تبان قدامك ع التابلت -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- استدعاء ملف الستايل المحلي من نفس الريبو -->
    <link href="./style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <script>
        // قراءة الرابط لو مبعوت، أو تشغيل هوشي ساجا الافتراضية محلياً
        var urlParams = new URLSearchParams(window.location.search);
        var targetSwf = urlParams.get("swf") || "./hoshi1.swf";

        var gameConfig = {
            swfUrl: targetSwf
        };
        console.log("🎮 Target SWF to load:", gameConfig.swfUrl);
    </script>

    <div id="waflashContainer">
        <canvas class="waflashCanvas" id="canvas" tabindex="1"></canvas>
        <div id="waflashStatus" style="display: none;">Playing...</div>
        
        <!-- استدعاء المشغل الرئيسي من نفس الريبو محلياً -->
        <script src="./main.js" crossorigin="anonymous" type="module"></script>
    </div>
</body>
</html>
